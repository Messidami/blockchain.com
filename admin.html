<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin Control — Wallet Master Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen" data-page="admin">

  <header class="sticky top-0 z-30 flex items-center justify-between px-5 sm:px-8 py-3.5 border-b bg-[#0B0E14]/95 backdrop-blur-md" style="border-color:var(--border)">
    <div class="flex items-center gap-3">
      <span class="px-2.5 py-1 text-xs font-bold rounded bg-[#F59E0B]/15 text-[#F59E0B] border border-[#F59E0B]/30">ADMIN PANEL</span>
      <span class="font-bold text-base">Wallet Master Control</span>
    </div>
    <div class="flex items-center gap-3">
      <a href="index.html" target="_blank" class="btn btn-ghost px-3.5 py-1.5 text-xs">Open Client Site ↗</a>
    </div>
  </header>

  <main class="px-5 sm:px-8 py-6 max-w-5xl mx-auto space-y-6">
    <div class="card p-6">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-5">
        <div>
          <h2 class="font-bold text-base">Manage User Portfolios &amp; Balances</h2>
          <p class="text-xs text-[var(--muted)]">Edit coin names or set any coin balance to 0 across all user profiles.</p>
        </div>
        <button onclick="saveAdminChanges()" id="btn-save-admin" class="btn btn-primary px-5 py-2.5 text-sm shadow-lg">
          ✓ Update &amp; Sync to Supabase
        </button>
      </div>

      <div id="admin-toast" class="hidden mb-4 p-3 rounded-lg bg-[#00C875]/15 border border-[#00C875]/30 text-[#00C875] text-xs font-semibold">
        ✓ Synced! User dashboard balances are now live in Supabase.
      </div>

      <div id="admin-assets-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <p class="text-xs text-[var(--muted)]">Loading user portfolios from Supabase...</p>
      </div>
    </div>
  </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
</body>
</html>
